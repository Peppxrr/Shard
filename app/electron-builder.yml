# electron-builder packaging. Windows: nsis per-user + portable.
# Linux targets can be added later without touching app code (core CMake is
# already cross-platform via obs-studio).
appId: com.shard.app
productName: Shard
buildNumber: "0"
publish:
  provider: github
  owner: Peppxrr
  repo: Shard
  releaseType: release
electronUpdaterCompatibility: ">=2.16"
releaseInfo:
  releaseNotesFile: release/release-notes.md
directories:
  output: release
  buildResources: build
# Repository examples (including Afterglow) are documentation downloads only.
# Keep them outside renderer imports and packaging resources.
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: ../NOTICE
    to: NOTICE
  - from: ../LICENSE
    to: LICENSE
  - from: resources/licenses
    to: licenses
  - from: resources/core-bin
    to: core-bin
    filter:
      - "**/*"
  - from: build/icon-256.png
    to: icon.png
  - from: resources/clip-sound.wav
    to: clip-sound.wav
  - from: resources/games.json
    to: games.json
asar: true
win:
  icon: build/icon.ico
  # Signing is intentionally off. Never re-sign the official OBS payload.
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Shard
portable:
  artifactName: ${productName}-${version}-portable.${ext}
