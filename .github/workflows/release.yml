name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        # Match build.ps1 and its child processes; inheriting PowerShell 7's
        # PSModulePath breaks Windows PowerShell's Get-FileHash on clean runners.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies (including Electron native modules)
        run: npm ci --prefix app
      - name: Verify and package release
        working-directory: app
        run: npm run verify -- release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-logs
          path: tmp/verify/
      - uses: actions/upload-artifact@v4
        with:
          name: shard-windows
          if-no-files-found: error
          path: |
            app/release/Shard-*.exe
            app/release/Shard-*.exe.blockmap
            app/release/latest.yml
            app/release/SHA256SUMS.txt
            app/release/release-notes.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shard-windows
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-runs may finish a draft, but must never replace a live release.
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Release is already published; use a new version.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Shard $RELEASE_TAG" --notes-file release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.exe release/*.blockmap release/latest.yml release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file release/release-notes.md --draft=false --latest
